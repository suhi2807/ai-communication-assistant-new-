<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Communication Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🤖 AI Communication Assistant</h1>

        <p class="subtitle">
            Analyze • Improve • Reply • Sentiment
        </p>

        <textarea
            id="message"
            placeholder="Type your message here..."></textarea>

        <div class="buttons">

            <button onclick="analyze()">
                Analyze
            </button>

            <button onclick="improve()">
                Improve
            </button>

            <button onclick="reply()">
                Reply
            </button>

            <button onclick="sentiment()">
                Sentiment
            </button>

        </div>

        <div class="card">
            <h2>Result</h2>

            <pre id="output">
Your AI response will appear here...
            </pre>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
